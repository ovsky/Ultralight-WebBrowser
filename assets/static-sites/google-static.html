<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultralight | Home Page</title>

  <!-- Favicon (Lightning Bolt) -->
  <link rel="icon" href="./favicon.webp">

  <style>
    /* Universal Box Sizing for Responsive Layouts */
    * {
      box-sizing: border-box;
    }

    /* Reset & Base Styles */
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Takes full height of browser */
      width: 100%;
      /* Takes full width of browser */
      font-family: arial, sans-serif;
      background-color: #202124;
      /* Google Dark Background */
      color: #202124;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      /* Do NOT animate the document root's opacity; keep the page background
        constant so we avoid a white flash. We'll fade only the main content. */
    }

    /* Main Content Area */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Padding to prevent touching edges on mobile */
      padding-bottom: 120px;
      /* Visual balance */
      width: 100%;
      /* Fade the visible content in while leaving the page background unchanged */
      opacity: 0;
      animation: ul_fade_in 0.2s ease-in forwards;
      -webkit-animation: ul_fade_in 0.2s ease-in forwards;
    }

    /* Google Logo SVG Container */
    .logo-svg {
      width: 272px;
      max-width: 100%;
      /* Responsive: shrinks on very small screens */
      height: auto;
      margin-bottom: 20px;
      margin-top: 140px;
      /* Increased top spacing again */
      fill: #ffffff;
    }

    /* Search Bar Container */
    .search-container {
      width: 100%;
      max-width: 584px;
    }

    /* The Search Form */
    .search-bar {
      background-color: #303134;
      border: 1px solid #5f6368;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 46px;
      width: 100%;
      /* Smoother Transition */
      transition: background-color 300ms cubic-bezier(0.4, 0, 0.2, 1),
        border-color 300ms cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-bar:hover,
    .search-bar:focus-within {
      background-color: #303134;
      border-color: rgba(223, 225, 229, 0);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Magnifying Glass Icon */
    .search-icon {
      fill: #9aa0a6;
      width: 20px;
      height: 20px;
      margin-right: 12px;
      flex-shrink: 0;
      /* Prevents icon from squishing */
    }

    /* Input Field */
    input[type="text"] {
      background-color: transparent;
      border: none;
      color: #e8eaed;
      font-size: 16px;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Buttons Area */
    .buttons {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      /* Buttons wrap on tiny screens */
    }

    button {
      background-color: #303134;
      border: 1px solid #303134;
      color: #e8eaed;
      font-size: 14px;
      padding: 0 24px;
      height: 36px;
      border-radius: 100px;
      cursor: pointer;
      transition: background-color 200ms ease,
        border-color 200ms ease,
        color 200ms ease,
        transform 100ms ease;
    }

    button:hover {
      background-color: #3c4043;
      border: 1px solid #5f6368;
      color: #fff;
    }

    button:active {
      transform: scale(0.96);
      background-color: #45494d;
    }

    /* Footer */
    footer {
      background-color: #171717;
      padding: 15px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #8ab4f8;
      border-top: 1px solid #303134;
      flex-shrink: 0;
      /* Prevents footer from collapsing */
    }

    .footer-icon {
      width: 18px;
      height: 18px;
      fill: #a142f4;
      transition: filter 300ms ease;
    }

    footer:hover .footer-icon {
      filter: drop-shadow(0 0 4px #a142f4);
    }
  </style>

  <style>
    @keyframes ul_fade_in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @-webkit-keyframes ul_fade_in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

  <style>
    /* Bookmark Bar Styles */
    .bookmark-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(29, 29, 33, 0.92);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-height: 36px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(60, 60, 70, 0.4);
      z-index: 1000;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .bookmark-bar::-webkit-scrollbar {
      height: 4px;
    }

    .bookmark-bar::-webkit-scrollbar-track {
      background: transparent;
    }

    .bookmark-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .bookmark-bar-empty {
      color: #9aa0a6;
      font-size: 0.8em;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: #e8eaed;
      font-size: 0.8em;
      transition: all 0.15s ease;
      max-width: 160px;
      background: transparent;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bookmark-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .bookmark-item:active {
      transform: scale(0.97);
    }

    .bookmark-item img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .bookmark-item .default-icon {
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #4285f4, #5e35b1);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .bookmark-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bookmark-item .remove-btn {
      display: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 100, 100, 0.8);
      color: white;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
      cursor: pointer;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .bookmark-item:hover .remove-btn {
      display: block;
    }

    .bookmark-item .remove-btn:hover {
      background: rgba(255, 60, 60, 1);
    }

    /* Drag and drop styles */
    .bookmark-item {
      cursor: grab;
    }

    .bookmark-item.dragging {
      opacity: 0.5;
      background: rgba(100, 100, 255, 0.3);
      cursor: grabbing;
    }

    .bookmark-item.drag-over {
      border-left: 3px solid #6C63FF;
      padding-left: 7px;
    }

    .bookmark-item.drag-over-right {
      border-right: 3px solid #6C63FF;
      padding-right: 7px;
    }

    .bookmark-bar.drag-active {
      background: rgba(29, 29, 33, 0.98);
    }

    /* Adjust main container for bookmark bar */
    .main-container {
      padding-top: 50px;
    }
  </style>
</head>

<body>

  <!-- Bookmark Bar -->
  <div class="bookmark-bar" id="bookmarkBar">
    <span class="bookmark-bar-empty" id="emptyMessage">Click the ★ icon to add bookmarks</span>
  </div>

  <div class="main-container">

    <!-- Search Form -->

    <a href="https://github.com/ovsky/Ultralight-WebBrowser" target="_blank" rel="noopener noreferrer"

  <script>
    // Helper to get first letter of domain for default icon
    function getFirstLetter(url) {
      try {
        const hostname = new URL(url).hostname;
        return hostname.replace('www.', '').charAt(0).toUpperCase();
      } catch (e) {
        return url.charAt(0).toUpperCase();
      }
    }

    // Mouse-based drag and drop state
    let dragState = {
      isDragging: false,
      element: null,
      bookmarkId: null,
      startX: 0,
      startY: 0,
      offsetX: 0,
      clone: null,
      moved: false
    };

    // Create a bookmark element with mouse drag support
    function createBookmarkElement(bookmark) {
      const item = document.createElement('div');
      item.className = 'bookmark-item';
      item.dataset.bookmarkId = bookmark.id;
      item.dataset.url = bookmark.url;

      // Icon (favicon or default)
      if (bookmark.favicon && bookmark.favicon.startsWith('data:')) {
        const img = document.createElement('img');
        img.src = bookmark.favicon;
        img.draggable = false;
        img.onerror = function () {
          const defaultIcon = document.createElement('div');
          defaultIcon.className = 'default-icon';
          defaultIcon.textContent = getFirstLetter(bookmark.url);
          this.replaceWith(defaultIcon);
        };
        item.appendChild(img);
      } else {
        const defaultIcon = document.createElement('div');
        defaultIcon.className = 'default-icon';
        defaultIcon.textContent = getFirstLetter(bookmark.url);
        item.appendChild(defaultIcon);
      }

      // Title
      const title = document.createElement('span');
      title.textContent = bookmark.title || bookmark.url;
      item.appendChild(title);

      // Remove button
      const removeBtn = document.createElement('div');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.onmousedown = function (e) {
        e.stopPropagation();
      };
      removeBtn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (window.removeBookmark) {
          window.removeBookmark(bookmark.id);
          loadBookmarks();
        }
      };
      item.appendChild(removeBtn);

      // Mouse down to start drag
      item.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        if (e.target.classList.contains('remove-btn')) return;

        e.preventDefault();

        dragState.isDragging = true;
        dragState.element = item;
        dragState.bookmarkId = bookmark.id;
        dragState.startX = e.clientX;
        dragState.startY = e.clientY;
        dragState.moved = false;

        const rect = item.getBoundingClientRect();
        dragState.offsetX = e.clientX - rect.left;

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
      });

      // Middle click opens in new tab
      item.addEventListener('auxclick', function (e) {
        if (e.button === 1) { // Middle mouse button
          e.preventDefault();
          openInNewTab(bookmark.url);
        }
      });

      // Click to navigate (only if not dragged)
      item.addEventListener('click', function (e) {
        if (dragState.moved) {
          e.preventDefault();
          return;
        }
        // Ctrl+Click opens in new tab
        if (e.ctrlKey) {
          e.preventDefault();
          e.stopPropagation();
          openInNewTab(bookmark.url);
          return;
        }
        // Regular click navigates in current tab
        window.location.href = bookmark.url;
      });

      return item;
    }

    // Open URL in new tab using native bridge
    function openInNewTab(url) {
      if (window.__ul_newTab) {
        window.__ul_newTab(url);
      } else if (window.__ul && window.__ul.newTab) {
        window.__ul.newTab(url);
      } else {
        // Fallback: just navigate
        window.location.href = url;
      }
    }

    function handleMouseMove(e) {
      if (!dragState.isDragging || !dragState.element) return;

      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;

      // Only start visual drag after moving a bit
      if (!dragState.moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
        dragState.moved = true;
        dragState.element.classList.add('dragging');
        document.getElementById('bookmarkBar').classList.add('drag-active');
      }

      if (!dragState.moved) return;

      // Find the bookmark item we're hovering over
      const bar = document.getElementById('bookmarkBar');
      const items = Array.from(bar.querySelectorAll('.bookmark-item'));

      // Clear all drag-over states
      items.forEach(item => item.classList.remove('drag-over', 'drag-over-right'));

      // Find which item we're over
      for (const item of items) {
        if (item === dragState.element) continue;

        const rect = item.getBoundingClientRect();
        const midX = rect.left + rect.width / 2;

        if (e.clientX >= rect.left && e.clientX <= rect.right) {
          if (e.clientX < midX) {
            item.classList.add('drag-over');
          } else {
            item.classList.add('drag-over-right');
          }
          break;
        }
      }
    }

    function handleMouseUp(e) {
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);

      if (!dragState.isDragging) return;

      const bar = document.getElementById('bookmarkBar');
      const items = Array.from(bar.querySelectorAll('.bookmark-item'));

      // Find drop target
      let dropTarget = null;
      let insertAfter = false;

      for (const item of items) {
        if (item.classList.contains('drag-over')) {
          dropTarget = item;
          insertAfter = false;
          break;
        }
        if (item.classList.contains('drag-over-right')) {
          dropTarget = item;
          insertAfter = true;
          break;
        }
      }

      // Move the element
      if (dropTarget && dropTarget !== dragState.element && dragState.moved) {
        if (insertAfter) {
          dropTarget.parentNode.insertBefore(dragState.element, dropTarget.nextSibling);
        } else {
          dropTarget.parentNode.insertBefore(dragState.element, dropTarget);
        }
        // Save new order
        saveBookmarkOrder();
      }

      // Clean up
      items.forEach(item => {
        item.classList.remove('dragging', 'drag-over', 'drag-over-right');
      });
      bar.classList.remove('drag-active');

      // Reset state after a short delay to prevent click from firing
      setTimeout(() => {
        dragState.isDragging = false;
        dragState.element = null;
        dragState.bookmarkId = null;
        dragState.moved = false;
      }, 10);
    }

    function saveBookmarkOrder() {
      const bar = document.getElementById('bookmarkBar');
      const items = bar.querySelectorAll('.bookmark-item');
      const orderedIds = Array.from(items).map(item => parseInt(item.dataset.bookmarkId));

      if (window.reorderBookmarks && orderedIds.length > 0) {
        window.reorderBookmarks(JSON.stringify(orderedIds));
      }
    }

    // Load and display bookmarks
    function loadBookmarks() {
      const bar = document.getElementById('bookmarkBar');
      const emptyMsg = document.getElementById('emptyMessage');

      bar.querySelectorAll('.bookmark-item').forEach(el => el.remove());

      let bookmarks = [];
      if (window.getBookmarkBar) {
        try {
          const json = window.getBookmarkBar();
          bookmarks = JSON.parse(json);
        } catch (e) {
          console.error('Error parsing bookmarks:', e);
        }
      }

      if (bookmarks.length === 0) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        bookmarks.forEach(bm => {
          const item = createBookmarkElement(bm);
          bar.appendChild(item);
        });
      }
    }

    // Load bookmarks when page is ready
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(loadBookmarks, 100);
    });

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(loadBookmarks, 100);
    }
  </script>
