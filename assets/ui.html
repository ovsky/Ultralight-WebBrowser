<html>

<head>
    <!-- Theme system - must load first -->
    <link rel="stylesheet" type="text/css" href="themes/theme-variables.css">
    <link rel="stylesheet" type="text/css" href="ui.css">
    <link rel="stylesheet" type="text/css" href="chrome-tabs.css">
    <script src="themes/theme.js"></script>
    <script src="ui.js"></script>
    <script src="anchorme.js"></script>

</head>

<body>
    <div class="chrome-tabs" data-chrome-tabs-instance-id="0">
        <div class="chrome-tabs-content">
            <button id="chrome-tabs-add-tab" class="chrome-tabs-add-tab" aria-label="New Tab"></button>
        </div>
        <div class="chrome-tabs-bottom-bar" style="z-index: 3;"></div>
    </div>

    <svg style="display: none;">
        <defs>
            <g id="svg_arrow_back">
                <path d="M427 277v-42h-260l119 -120l-30 -30l-171 171l171 171l30 -30l-119 -120h260z" />
            </g>
            <g id="svg_arrow_forward">
                <path d="M256 427l171 -171l-171 -171l-30 30l119 120h-260v42h260l-119 120z" />
            </g>
            <g id="svg_refresh">
                <path transform="matrix(1 0 0 -1 0 512)"
                    d="M377 377l50 50v-150h-150l69 69c-23 23 -55 38 -90 38c-71 0 -128 -57 -128 -128s57 -128 128 -128c56 0 104 35 121 85h44c-19 -74 -85 -128 -165 -128c-94 0 -170 77 -170 171s76 171 170 171c47 0 90 -19 121 -50z" />
            </g>
            <g id="svg_stop">
                <path
                    d="M405 375l-119 -119l119 -119l-30 -30l-119 119l-119 -119l-30 30l119 119l-119 119l30 30l119 -119l119 119z" />
            </g>
            <g id="svg_tools">
                <path
                    d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" />
            </g>
            <g id="svg_bookmark_outline">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                    fill="none" stroke="currentColor" stroke-width="2" />
            </g>
            <g id="svg_bookmark_filled">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
                    fill="currentColor" />
            </g>
        </defs>
    </svg>

    <div id="bar">
        <span id="back" class="icon disabled">
            <svg viewBox="0 0 512 512" width="20" height="20">
                <use xlink:href="#svg_arrow_back" />
            </svg>
        </span>
        <span id="forward" class="icon disabled">
            <svg viewBox="0 0 512 512" width="20" height="20">
                <use xlink:href="#svg_arrow_forward" />
            </svg>
        </span>
        <span id="refresh" class="icon">
            <svg viewBox="0 0 512 512" width="20" height="20">
                <use xlink:href="#svg_refresh" />
            </svg>
        </span>
        <span id="stop" class="icon" style="display: none;">
            <svg viewBox="0 0 512 512" width="20" height="20">
                <use xlink:href="#svg_stop" />
            </svg>
        </span>
        <input onfocus="select_next_mouseup = true;"
            onmouseup="if (select_next_mouseup) this.select(); select_next_mouseup = false;" type="text"
            id="address"></input>
        <span id="zoom-badge" class="zoom-badge" role="button" tabindex="0"
            aria-label="Page zoom. Click to reset to 100%" data-tooltip="Reset zoom (Ctrl+0)"
            style="display: none;">100%</span>
        <span id="toggle-bookmark" class="icon" role="button" tabindex="0" aria-label="Toggle bookmark"
            data-tooltip="Bookmark this page">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" id="bookmark-icon">
                <use xlink:href="#svg_bookmark_outline" />
            </svg>
        </span>
        <span id="toggle-tools" class="icon" role="button" tabindex="0" aria-label="Toggle inspector"
            data-tooltip="Inspector">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <use xlink:href="#svg_tools" />
            </svg>
        </span>
        <span id="toggle-downloads" class="icon" role="button" tabindex="0" aria-label="View downloads"
            data-tooltip="Downloads">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor" />
            </svg>
            <span id="downloads-badge" class="downloads-badge"></span>
        </span>

        <span id="toggle-adblock" class="icon" role="button" tabindex="0" aria-label="Toggle ad blocking"
            data-tooltip="AdBlock">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 2L4 5v6.09c0 5.06 3.43 9.8 8 10.91c4.57-1.11 8-5.85 8-10.91V5l-8-3z" fill="currentColor" />
            </svg>
        </span>

        <span id="toggle-menu" class="icon" role="button" tabindex="0" aria-label="Open menu" aria-haspopup="true"
            data-tooltip="Menu">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="5" cy="12" r="2" fill="currentColor"></circle>
                <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                <circle cx="19" cy="12" r="2" fill="currentColor"></circle>
            </svg>
        </span>
    </div>

    <!-- Session Restore Bar -->
    <div id="session-restore-bar" role="alert" aria-live="polite">
        <div class="restore-message">
            <svg class="restore-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"
                    fill="currentColor" />
                <path d="M12 8v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" fill="currentColor" />
            </svg>
            <span id="restore-message-text">Your previous session was interrupted. Would you like to restore your
                tabs?</span>
        </div>
        <div class="restore-actions">
            <button class="restore-btn primary" id="restore-session-btn">Restore</button>
            <button class="restore-btn secondary" id="dismiss-session-btn">Start Fresh</button>
            <button class="dismiss-btn" id="close-restore-bar" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>

    <div id="menu-dropdown" class="menu-dropdown hidden" role="menu" aria-hidden="true">
        <div class="menu-item" data-action="new-tab">New tab [Ctrl+T]</div>
        <div class="menu-item" data-action="new-window">New window [Ctrl+N]</div>
        <div class="menu-separator"></div>
        <div class="menu-item" data-action="history">History</div>
        <div class="menu-item" data-action="downloads">Downloads</div>
    </div>

    <script src="draggabilly.pkgd.min.js"></script>
    <script src="chrome-tabs.js"></script>
    <script>
        var el = document.querySelector('.chrome-tabs')
        var chromeTabs = new ChromeTabs()
        var select_next_mouseup = false;
        var defaultFavicon = "earth.svg";
        var suggEl = null;
        var suggActiveIndex = -1;
        var suggOverlayOpen = false;

        chromeTabs.init(el, {
            tabOverlapDistance: 6,
            minWidth: 45,
            maxWidth: 243
        })

        function addTab(id, title, faviconUrl, isLoading) {
            const icon = (typeof faviconUrl === 'string' && faviconUrl.length > 0) ? faviconUrl : defaultFavicon;
            chromeTabs.addTab({ id: id, title: title, favicon: icon, loading: isLoading });
        }

        function updateTab(id, title, faviconUrl, isLoading) {
            const tab = document.querySelector("[data-tab-id='" + id + "']");
            const icon = (typeof faviconUrl === 'string' && faviconUrl.length > 0) ? faviconUrl : defaultFavicon;
            if (tab)
                chromeTabs.updateTab(tab, { title: title, favicon: icon, loading: isLoading });
        }

        function closeTab(id) {
            const tab = document.querySelector("[data-tab-id='" + id + "']");
            if (tab)
                chromeTabs.removeTab(tab);
        }

        // Update bookmark button state (called from C++)
        function updateBookmarkButton(isBookmarked) {
            const btn = document.getElementById('toggle-bookmark');
            const icon = document.getElementById('bookmark-icon');
            if (!btn || !icon) return;

            const useEl = icon.querySelector('use');
            if (useEl) {
                if (isBookmarked) {
                    useEl.setAttribute('xlink:href', '#svg_bookmark_filled');
                    btn.classList.add('bookmarked');
                    btn.setAttribute('data-tooltip', 'Remove bookmark');
                } else {
                    useEl.setAttribute('xlink:href', '#svg_bookmark_outline');
                    btn.classList.remove('bookmarked');
                    btn.setAttribute('data-tooltip', 'Bookmark this page');
                }
            }
        }

        // Session Restore Bar Functions
        function showSessionRestoreBar(tabCount, wasCrash) {
            const bar = document.getElementById('session-restore-bar');
            const msgText = document.getElementById('restore-message-text');
            if (!bar || !msgText) return;

            if (wasCrash) {
                msgText.textContent = `Your previous session was interrupted. Restore ${tabCount} tab${tabCount !== 1 ? 's' : ''}?`;
            } else {
                msgText.textContent = `Would you like to restore ${tabCount} tab${tabCount !== 1 ? 's' : ''} from your last session?`;
            }

            bar.classList.add('visible');
            try { document.body.classList.add('session-restore-visible'); } catch (e) {}

            // Set up event handlers
            const restoreBtn = document.getElementById('restore-session-btn');
            const dismissBtn = document.getElementById('dismiss-session-btn');
            const closeBtn = document.getElementById('close-restore-bar');

            const hideBar = () => {
                bar.classList.remove('visible');
                try { document.body.classList.remove('session-restore-visible'); } catch (e) {}
            };

            if (restoreBtn) {
                restoreBtn.onclick = () => {
                    hideBar();
                    if (window.OnRestoreSession) OnRestoreSession();
                };
            }

            if (dismissBtn) {
                dismissBtn.onclick = () => {
                    hideBar();
                    if (window.OnDismissSession) OnDismissSession();
                };
            }

            if (closeBtn) {
                closeBtn.onclick = () => {
                    hideBar();
                    if (window.OnDismissSession) OnDismissSession();
                };
            }
        }

        // Favicon bridge: receive events from pages or direct calls and update the current tab's favicon
        (function setupFaviconBridge() {
            // If a page calls the global function directly, forward it to a custom event
            if (typeof OnFaviconReady !== 'function') {
                window.OnFaviconReady = function(url, href) {
                    try { window.dispatchEvent(new CustomEvent('FaviconReady', { detail: { url: String(url||''), href: String(href||'') } })); } catch (e) {}
                }
            }

            // Listen for dispatched events and update the active tab's favicon
            window.addEventListener('FaviconReady', (e) => {
                try {
                    const href = e.detail && e.detail.href ? String(e.detail.href) : '';
                    if (!href) return;
                    const cur = document.querySelector('.chrome-tab.chrome-tab-current');
                    if (cur && window.chromeTabs && typeof chromeTabs.updateTab === 'function') {
                        chromeTabs.updateTab(cur, { favicon: href });
                    }
                } catch (err) {
                    // no-op
                }
            });
        })();

        function hideSessionRestoreBar() {
            const bar = document.getElementById('session-restore-bar');
            if (bar) bar.classList.remove('visible');
            try { document.body.classList.remove('session-restore-visible'); } catch (e) {}
        }

        // Page zoom indicator.
        //
        // Driven by the native side after any zoom change. Hidden at 100% so the
        // toolbar matches Chrome, which only surfaces the badge once zoom has
        // actually moved off 100%.
        (function setupZoomBadge() {
            const badge = document.getElementById('zoom-badge');
            if (!badge) return;

            const render = (percent) => {
                if (!percent || percent === 100) {
                    badge.style.display = 'none';
                    return;
                }
                badge.style.display = '';
                badge.textContent = percent + '%';
            };

            // Called natively after Ctrl+plus/minus/0. Defined here rather than
            // bound by C++ so the badge owns its own DOM.
            window.OnZoomChanged = render;

            const reset = () => {
                if (typeof OnResetZoom === 'function') OnResetZoom();
            };
            badge.addEventListener('click', reset);
            badge.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    reset();
                }
            });
        })();

        function bindCallbacks() {
            el.addEventListener('requestNewTab', ({ detail }) => OnRequestNewTab());
            el.addEventListener('requestTabClose', ({ detail }) => OnRequestTabClose(detail.tabEl.getAttribute('data-tab-id')));
            el.addEventListener('activeTabChange', ({ detail }) => OnActiveTabChange(detail.tabEl.getAttribute('data-tab-id')));
            document.querySelector('#back').addEventListener('click', event => OnBack());
            document.querySelector('#forward').addEventListener('click', event => OnForward());
            document.querySelector('#refresh').addEventListener('click', event => OnRefresh());
            document.querySelector('#stop').addEventListener('click', event => OnStop());

            // Bookmark button handler
            const bookmarkBtn = document.querySelector('#toggle-bookmark');
            if (bookmarkBtn) {
                const toggleBookmark = () => {
                    if (window.OnToggleBookmark) {
                        OnToggleBookmark();
                    }
                };
                bookmarkBtn.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleBookmark();
                });
                bookmarkBtn.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleBookmark();
                    }
                });
            }

            const inspectorBtn = document.querySelector('#toggle-tools');
            if (inspectorBtn) {
                const toggleInspector = () => { if (window.OnToggleTools) OnToggleTools(); };
                inspectorBtn.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleInspector();
                });
                inspectorBtn.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleInspector();
                    }
                });
            }
            const downloadsBtn = document.querySelector('#toggle-downloads');
            if (downloadsBtn) {
                const toggleDownloads = () => {
                    if (window.OnDownloadsOverlayToggle) OnDownloadsOverlayToggle();
                };
                downloadsBtn.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleDownloads();
                });
                downloadsBtn.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleDownloads();
                    }
                });
            }
            const adblockBtn = document.querySelector('#toggle-adblock');
            if (adblockBtn) {
                const toggleAdblock = () => {
                    if (window.OnToggleAdblock) {
                        OnToggleAdblock();
                        // Update visual state after toggle
                        setTimeout(() => {
                            if (window.GetAdblockEnabled) {
                                const isEnabled = GetAdblockEnabled();
                                adblockBtn.classList.toggle('active', isEnabled);
                            }
                        }, 50);
                    }
                };
                adblockBtn.addEventListener('click', event => {
                    event.stopPropagation();
                    toggleAdblock();
                });
                adblockBtn.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleAdblock();
                    }
                });
                // Initialize state on load
                setTimeout(() => {
                    if (window.GetAdblockEnabled) {
                        const isEnabled = GetAdblockEnabled();
                        adblockBtn.classList.toggle('active', isEnabled);
                    }
                }, 100);
            }
            var address = document.querySelector('#address');
            address.onkeypress = (function (e) {
                if (e.which == '13') {
                    if (suggOverlayOpen) { e.preventDefault(); return false; }
                    address.blur();
                    let url = address.value;
                    if (anchorme.validate.url(url) || anchorme.validate.ip(url)) {
                        if (url.toLowerCase().startsWith("http://") || url.toLowerCase().startsWith("https://")) {
                            OnAddressBarNavigate(url);
                        } else {
                            OnAddressBarNavigate("http://" + url);
                        }
                    } else if (url.toLowerCase().startsWith("file:///")) {
                        OnAddressBarNavigate(url);
                    } else if (url.toLowerCase().startsWith("file://")) {
                        OnAddressBarNavigate("file:///" + url.substring(7));
                    } else {
                        // Interpret as search
                        OnAddressBarNavigate("https://www.google.com/search?q=" + encodeURIComponent(url));
                    }

                    return false;
                }
            });

            // Suggestions now use a native overlay (like menu/context menu) to avoid clipping.

            // Debounce helper
            let suggTimer = null;
            function scheduleSuggest() {
                if (window.__ul_settings && window.__ul_settings.enable_suggestions === false) {
                    hideSuggestions();
                    return;
                }
                if (suggTimer) clearTimeout(suggTimer);
                suggTimer = setTimeout(updateSuggestions, 80);
            }

            function hideSuggestions() {
                suggActiveIndex = -1;
                if (typeof CloseSuggestionsOverlay === 'function') CloseSuggestionsOverlay();
                if (typeof OnSuggestClose === 'function') OnSuggestClose();
                suggOverlayOpen = false;
            }

            function showSuggestions(items) {
                if (window.__ul_settings && window.__ul_settings.enable_suggestions === false) { hideSuggestions(); return; }
                if (!items || !items.length) { hideSuggestions(); return; }
                const r = address.getBoundingClientRect();
                // Request temporary UI overlay growth so the panel isn't clipped
                const rows = items.length;
                const desired = Math.min(320, Math.max(120, 30 * rows + 12));
                if (typeof OnSuggestOpen === 'function') OnSuggestOpen(desired);
                // Ask native to show overlay with these items positioned under address bar
                const json = JSON.stringify(items);
                if (typeof OpenSuggestionsOverlay === 'function') {
                    OpenSuggestionsOverlay(Math.round(r.left), Math.round(r.bottom + 4), Math.round(r.width), json);
                }
                suggOverlayOpen = true;
            }

            function commitSuggestion(text) {
                if (!text) return;
                address.value = text;
                hideSuggestions();
                // trigger navigation same as pressing Enter
                if (window.OnAddressBarNavigate) {
                    let url = text;
                    if (anchorme.validate.url(url) || anchorme.validate.ip(url)) {
                        if (url.toLowerCase().startsWith("http://") || url.toLowerCase().startsWith("https://")) {
                            OnAddressBarNavigate(url);
                        } else {
                            OnAddressBarNavigate("http://" + url);
                        }
                    } else {
                        OnAddressBarNavigate("https://www.google.com/search?q=" + encodeURIComponent(url));
                    }
                }
            }

            function renderSuggestions(items) { suggActiveIndex = -1; showSuggestions(items); }

            function updateSuggestions() {
                if (window.__ul_settings && window.__ul_settings.enable_suggestions === false) { hideSuggestions(); return; }
                const q = address.value.trim();
                if (!q) { hideSuggestions(); return; }
                try {
                    if (typeof GetSuggestions === 'function') {
                        const raw = GetSuggestions(q, 10);
                        let arr = [];
                        if (typeof raw === 'string') arr = JSON.parse(raw);
                        else if (Array.isArray(raw)) arr = raw;
                        renderSuggestions(arr || []);
                    } else {
                        hideSuggestions();
                    }
                } catch (e) {
                    hideSuggestions();
                }
            }

            // Events for suggestions
            address.addEventListener('input', () => { scheduleSuggest(); });
            address.addEventListener('focus', () => { if (address.value.trim()) { scheduleSuggest(); } });
            address.addEventListener('blur', () => { setTimeout(hideSuggestions, 50); });
            window.addEventListener('resize', () => { /* overlay will be closed and reopened on input change */ });

            address.addEventListener('keydown', (e) => {
                if (suggEl.style.display !== 'block') return;
                const total = suggEl.children.length;
                if (e.key === 'ArrowDown' && total) {
                    e.preventDefault();
                    suggActiveIndex = (suggActiveIndex + 1 + total) % total;
                    Array.from(suggEl.children).forEach((c, i) => c.classList.toggle('active', i === suggActiveIndex));
                } else if (e.key === 'ArrowUp' && total) {
                    e.preventDefault();
                    suggActiveIndex = (suggActiveIndex - 1 + total) % total;
                    Array.from(suggEl.children).forEach((c, i) => c.classList.toggle('active', i === suggActiveIndex));
                } else if (e.key === 'Enter') {
                    // Let Enter flow to existing navigation logic; overlay will be closed by blur/commit.
                } else if (e.key === 'Escape') {
                    hideSuggestions();
                }
            });
        }

        bindCallbacks();

        // Menu dropdown logic
        (function initMenu() {
            const toggleBtn = document.getElementById('toggle-menu');
            const menu = document.getElementById('menu-dropdown');

            function openMenu() {
                // Use native overlay instead of inline dropdown
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
                if (window.OnMenuOpen) OnMenuOpen();
            }
            function closeMenu() {
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
                if (window.OnMenuClose) OnMenuClose();
            }
            function isMenuOpen() {
                return menu && !menu.classList.contains('hidden');
            }

            if (toggleBtn) {
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMenu();
                });
                toggleBtn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openMenu();
                    }
                });
            }

            // Handle menu item clicks
            // Inline menu is no longer used; actions handled by menu overlay

            // Close on outside click
            document.addEventListener('click', (e) => {
                const within = e.target.closest('#toggle-menu');
                if (!within) closeMenu();
            });

            // Close on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isMenuOpen()) closeMenu();
            });
        })();

        (function initDownloadsPreview() {
            const toggleBtn = document.getElementById('toggle-downloads');
            const badge = document.getElementById('downloads-badge');

            function closePanel() {
                if (window.OnDownloadsOverlayClose) OnDownloadsOverlayClose();
            }

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#toggle-downloads')) closePanel();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closePanel();
            });

            function updateBadge() {
                if (!toggleBtn || !badge) return;
                try {
                    if (window.__ul_settings && window.__ul_settings.show_download_badge === false) {
                        toggleBtn.classList.remove('badge-visible');
                        badge.textContent = '';
                        return;
                    }
                    if (typeof GetDownloadsSnapshot === 'function') {
                        const raw = GetDownloadsSnapshot();
                        const data = JSON.parse(raw || '{"items":[]}');
                        const items = Array.isArray(data.items) ? data.items : [];
                        const active = items.filter(item => item.status === 'in-progress' || item.status === 'requested').length;
                        if (active > 0) {
                            badge.textContent = active > 9 ? '9+' : String(active);
                            toggleBtn.classList.add('badge-visible');
                        } else {
                            toggleBtn.classList.remove('badge-visible');
                        }
                    }
                } catch (e) {
                    toggleBtn.classList.remove('badge-visible');
                }
            }

            window.__ul_update_downloads_badge = updateBadge;
            updateBadge();
            setInterval(updateBadge, 2000);
        })();

        (function initToolbarTooltips() {
            const targets = document.querySelectorAll('[data-tooltip]');
            if (!targets || !targets.length) return;
            const tooltip = document.createElement('div');
            tooltip.id = 'toolbar-tooltip';
            tooltip.className = 'toolbar-tooltip';
            tooltip.setAttribute('role', 'tooltip');
            tooltip.style.visibility = 'hidden';
            document.body.appendChild(tooltip);

            let hideTimer = null;
            let currentTarget = null;

            function show(target) {
                if (!target) return;
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                const text = target.getAttribute('data-tooltip');
                if (!text) return;
                currentTarget = target;
                tooltip.textContent = text;
                tooltip.classList.remove('below');
                tooltip.classList.add('visible');
                tooltip.style.visibility = 'hidden';

                requestAnimationFrame(() => {
                    if (currentTarget !== target) return;
                    const rect = target.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const clampedX = Math.min(window.innerWidth - 12, Math.max(12, centerX));
                    tooltip.style.left = Math.round(clampedX) + 'px';

                    const tipRect = tooltip.getBoundingClientRect();
                    let top = rect.top - tipRect.height - 10;
                    let placeBelow = false;
                    if (top < 6) {
                        top = rect.bottom + 10;
                        placeBelow = true;
                    }
                    if (placeBelow && top + tipRect.height > window.innerHeight - 6) {
                        top = Math.max(6, window.innerHeight - tipRect.height - 6);
                    }
                    tooltip.classList.toggle('below', placeBelow);
                    tooltip.style.top = Math.round(top) + 'px';
                    tooltip.style.visibility = 'visible';
                });
            }

            function hide(immediate) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                const finish = () => {
                    currentTarget = null;
                    tooltip.classList.remove('visible');
                    tooltip.classList.remove('below');
                    tooltip.style.visibility = 'hidden';
                };
                if (immediate) {
                    finish();
                    return;
                }
                hideTimer = setTimeout(finish, 100);
            }

            targets.forEach(target => {
                target.addEventListener('mouseenter', () => show(target));
                target.addEventListener('mouseleave', () => hide(false));
                target.addEventListener('focus', () => show(target));
                target.addEventListener('blur', () => hide(false));
            });

            document.addEventListener('mousedown', () => hide(true));
            window.addEventListener('scroll', () => hide(true));
            window.addEventListener('resize', () => hide(true));
        })();
    </script>

    <script>
        // Password save bar functionality
        (function () {
            var bar = document.getElementById('password-save-bar');
            var originSpan = document.getElementById('password-save-origin');
            var usernameSpan = document.getElementById('password-save-username');
            var saveBtn = document.getElementById('password-save-btn');
            var neverBtn = document.getElementById('password-never-btn');
            var closeBtn = document.getElementById('password-close-btn');

            var currentOrigin = '';
            var currentUsername = '';
            var autoSaveTimer = null;
            var countdownInterval = null;

            window.showPasswordSaveBar = function (origin, username) {
                // Clear any existing timers
                if (autoSaveTimer) clearTimeout(autoSaveTimer);
                if (countdownInterval) clearInterval(countdownInterval);

                currentOrigin = origin;
                currentUsername = username;

                // Extract domain from origin
                try {
                    var url = new URL(origin);
                    originSpan.textContent = url.hostname;
                } catch (e) {
                    originSpan.textContent = origin;
                }
                usernameSpan.textContent = username;

                // Get autosave info element
                var autosaveInfo = document.getElementById('password-autosave-info');

                // Update save button text with countdown
                var countdown = 10;
                saveBtn.textContent = 'Save (' + countdown + ')';
                if (autosaveInfo) autosaveInfo.textContent = 'Auto-saving in ' + countdown + 's...';

                countdownInterval = setInterval(function () {
                    countdown--;
                    if (countdown > 0) {
                        saveBtn.textContent = 'Save (' + countdown + ')';
                        if (autosaveInfo) autosaveInfo.textContent = 'Auto-saving in ' + countdown + 's...';
                    } else {
                        saveBtn.textContent = 'Save';
                        if (autosaveInfo) autosaveInfo.textContent = 'Saving...';
                        clearInterval(countdownInterval);
                        countdownInterval = null;
                    }
                }, 1000);

                // Auto-save after 10 seconds if user doesn't respond
                autoSaveTimer = setTimeout(function () {
                    if (window.OnPasswordSaveBarResponse) {
                        OnPasswordSaveBarResponse('save', currentOrigin, currentUsername);
                    }
                    window.hidePasswordSaveBar();
                }, 10000);

                bar.classList.remove('hidden');
                setTimeout(function () {
                    bar.classList.add('visible');
                }, 10);
            };

            window.hidePasswordSaveBar = function () {
                // Clear timers
                if (autoSaveTimer) {
                    clearTimeout(autoSaveTimer);
                    autoSaveTimer = null;
                }
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                saveBtn.textContent = 'Save';
                var autosaveInfo = document.getElementById('password-autosave-info');
                if (autosaveInfo) autosaveInfo.textContent = '';

                bar.classList.remove('visible');
                setTimeout(function () {
                    bar.classList.add('hidden');
                }, 300);
            };

            if (saveBtn) {
                saveBtn.addEventListener('click', function () {
                    if (window.OnPasswordSaveBarResponse) {
                        OnPasswordSaveBarResponse('save', currentOrigin, currentUsername);
                    }
                    window.hidePasswordSaveBar();
                });
            }

            if (neverBtn) {
                neverBtn.addEventListener('click', function () {
                    if (window.OnPasswordSaveBarResponse) {
                        OnPasswordSaveBarResponse('never', currentOrigin, currentUsername);
                    }
                    window.hidePasswordSaveBar();
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function () {
                    window.hidePasswordSaveBar();
                });
            }
        })();
    </script>

            var enableAlwaysBtn = document.getElementById('drm-enable-always-btn');
            var closeBtn = document.getElementById('drm-close-btn');

            var currentUrl = '';
            var currentTabId = 0;

            window.showDrmPromptBar = function (url, tabId) {
                currentUrl = url;
                currentTabId = tabId;

                // Extract domain from URL

                    var urlObj = new URL(url);

                } catch (e) {
                    originSpan.textContent = url;
                }

                bar.classList.remove('hidden');

                    window.hideDrmPromptBar();

                    if (window.OnDrmPromptResponse) {

                    window.hideDrmPromptBar();
