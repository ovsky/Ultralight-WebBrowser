<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Tab search</title>
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", -apple-system, Ubuntu, Arial, sans-serif;
      font-size: 14px;
      color: var(--color-text-primary, #e2e1ea);
    }

    #panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--color-bg-overlay, #2b2b38);
      color: var(--color-text-primary, #e2e1ea);
      border-bottom: 1px solid var(--color-border-primary, #313146);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px 0;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      cursor: pointer;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
    }

    .row:hover,
    .row.active {
      background: var(--color-bg-hover, #343446);
    }

    .favicon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border-radius: 3px;
      background: var(--color-bg-tertiary, #1f1f2b);
      object-fit: contain;
    }

    .text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .title {
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-text-primary, #e2e1ea);
    }

    .url {
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-text-muted, #71718a);
    }

    /* Chrome marks the tab that is currently in front. */
    .row.current .title {
      font-weight: 600;
    }

    .current-dot {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent-primary, #6c63ff);
    }

    .empty {
      padding: 10px 12px;
      color: var(--color-text-muted, #71718a);
    }
  </style>
</head>

<body>
  <div id="panel" role="listbox" aria-label="Open tabs"></div>
  <script>
    let activeIndex = -1;
    let rows = [];

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function setActive(idx) {
      for (let i = 0; i < rows.length; i++) {
        rows[i].classList.toggle('active', i === idx);
      }
      activeIndex = rows.length ? clamp(idx, -1, rows.length - 1) : -1;

      if (activeIndex >= 0 && rows[activeIndex]) {
        // Keep the highlighted row in view without scrolling the whole panel.
        const panel = document.getElementById('panel');
        const r = rows[activeIndex].getBoundingClientRect();
        const pr = panel.getBoundingClientRect();
        if (r.top < pr.top) panel.scrollTop -= (pr.top - r.top);
        else if (r.bottom > pr.bottom) panel.scrollTop += (r.bottom - pr.bottom);
      }
    }

    function commit() {
      if (activeIndex < 0 || activeIndex >= rows.length) return;
      const id = rows[activeIndex].getAttribute('data-tab-id');
      if (window.OnTabSearchPick) OnTabSearchPick(String(id));
    }

    function close() {
      if (window.CloseTabSearchOverlay) CloseTabSearchOverlay();
    }

    function build(tabsJson) {
      const panel = document.getElementById('panel');
      panel.innerHTML = '';
      rows = [];

      let tabs = [];
      try { tabs = JSON.parse(String(tabsJson || '[]')); } catch (e) { tabs = []; }
      if (!Array.isArray(tabs)) tabs = [];

      if (tabs.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No open tabs';
        panel.appendChild(empty);
        setActive(-1);
        return;
      }

      tabs.forEach((tab, idx) => {
        const div = document.createElement('div');
        div.className = 'row' + (tab && tab.current ? ' current' : '');
        div.setAttribute('role', 'option');
        div.setAttribute('data-tab-id', String(tab && tab.id != null ? tab.id : ''));

        if (tab && tab.current) {
          const dot = document.createElement('span');
          dot.className = 'current-dot';
          dot.title = 'Current tab';
          div.appendChild(dot);
        }

        const fav = document.createElement('img');
        fav.className = 'favicon';
        fav.alt = '';
        // A plain URL in an <img> needs no CORS; the old canvas round-trip here
        // is what made favicons silently disappear.
        fav.src = String((tab && tab.favicon) || '');
        fav.addEventListener('error', function () { this.style.visibility = 'hidden'; });
        div.appendChild(fav);

        const text = document.createElement('span');
        text.className = 'text';

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = String((tab && tab.title) || (tab && tab.url) || 'Untitled');
        text.appendChild(title);

        const url = document.createElement('span');
        url.className = 'url';
        url.textContent = String((tab && tab.url) || '');
        text.appendChild(url);

        div.appendChild(text);

        div.addEventListener('click', function () {
          setActive(idx);
          commit();
        });
        div.addEventListener('mouseenter', function () { setActive(idx); });

        panel.appendChild(div);
        rows.push(div);
      });

      // Start on the current tab so Enter without arrowing is a no-op, which is
      // what Chrome does.
      const current = rows.findIndex(r => r.classList.contains('current'));
      setActive(current >= 0 ? current : 0);
    }

    // Called by the host with the tab list as JSON.
    window.OnTabSearchShow = build;

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowDown': e.preventDefault(); setActive(activeIndex + 1); break;
        case 'ArrowUp': e.preventDefault(); setActive(activeIndex - 1); break;
        case 'Enter': e.preventDefault(); commit(); break;
        case 'Escape': e.preventDefault(); close(); break;
      }
    });
  </script>
</body>

</html>
