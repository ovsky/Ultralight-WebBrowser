<html>

<head>
    <meta charset="utf-8" />
    <title>History</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c2bce8'%3E%3Cpath d='M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" type="text/css" href="ui.css">
    <link rel="stylesheet" href="themes/theme-variables.css">
    <style>
        * {
        }

        :root {
            /* Map local variables to global theme vars so the page follows the active theme */
            --bg: var(--color-bg-primary, #f6f7f9);
            --fg: var(--color-text-primary, #111);
            --muted: var(--color-text-secondary, #666);
            --accent-color: var(--color-accent-primary, #6C63FF);
            --accent: var(--accent-color);
            --accent-light: var(--color-accent-light, rgba(108, 99, 255, 0.15));
            --btn-bg: var(--color-bg-elevated, #ffffff);
            color-scheme: light dark;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto !important;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: var(--bg, #f6f7f9);
            color: var(--fg, #111);
            min-height: 100vh;
            opacity: 0;
            /* Fade in on load (CSS only) */
            animation: ul_fade_in 1s ease forwards;
            -webkit-animation: ul_fade_in 1s ease forwards;
        }

        .container {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 16px 48px;
            overflow: visible !important;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Buttons standardized via assets/ui.css */
        /* Use .btn and .btn-primary to get consistent visuals */

        /* Header controls rely on global `.btn` styles in assets/ui.css */
        header .controls .btn { /* no local visual overrides */ }

        .muted {
            color: var(--muted, #666);
        }

        ul.list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li.item {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .title {
            font-weight: 500;
            margin: 0 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            font-size: 12px;
            color: var(--muted, #666);
            display: flex;
            gap: 8px;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        a.entry-link {
            color: inherit;
            text-decoration: none;
        }

        a.entry-link:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #666;
        }

        /* No toggle anymore */
    @keyframes ul_fade_in { from { opacity: 0; } to { opacity: 1; } }
    @-webkit-keyframes ul_fade_in { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <script defer src="themes/theme.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>History</h1>
            <div class="controls">
                <button id="clear-btn" class="btn btn-primary">Clear history</button>
            </div>
        </header>

        <section id="content">
            <ul id="history-list" class="list"></ul>
            <div id="empty" class="empty" style="display:none">No history yet.</div>
        </section>
    </div>


    <script>
        function render(data) {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('empty');
            list.innerHTML = '';
            const items = (data && data.items) || [];
            if (!items.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            for (const it of items) {
                const li = document.createElement('li');
                li.className = 'item';
                const a = document.createElement('a');
                a.className = 'entry-link';
                a.href = it.url;
                a.textContent = (it.title && it.title.trim()) ? it.title : it.url;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    // Navigate in current tab
                    window.location.href = it.url;
                });
                const title = document.createElement('div');
                title.className = 'title';
                title.appendChild(a);
                const meta = document.createElement('div');
                meta.className = 'meta';
                const urlSpan = document.createElement('span');
                urlSpan.textContent = it.url;
                const timeSpan = document.createElement('span');
                timeSpan.textContent = fmtTime(it.time);
                meta.appendChild(urlSpan);
                meta.appendChild(timeSpan);
                li.appendChild(title);
                li.appendChild(meta);
                list.appendChild(li);
            }
        }

        function refresh() {
            try {
                if (window.NativeGetHistory) {
                    const json = NativeGetHistory();
                    const data = JSON.parse(json || '{}');
                    render(data);
                    return;
                }
            } catch (e) { }
            // Fallback empty state
            render({ items: [] });
        }

        // Called by native after JS bridge is bound
        window.__ul_history_ready = function () {
            refresh();
        }

        document.getElementById('clear-btn').addEventListener('click', () => {
            try { if (window.NativeClearHistory) NativeClearHistory(); } catch { }
            refresh();
        });

        // Auto-refresh when entering the page and when it becomes visible/focused
        document.addEventListener('DOMContentLoaded', () => {
            // If native not ready yet, retry shortly
            let tries = 0;
            const tick = () => {
                if (window.NativeGetHistory) { refresh(); return; }
                if (++tries < 20) setTimeout(tick, 50);
            };
            tick();
        });
        window.addEventListener('focus', refresh);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    </script>
</body>

</html>
