<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading DRM System...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }
        .spinner svg {
            width: 100%;
            height: 100%;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #e0e0e0;
        }
        p {
            font-size: 14px;
            color: #a0a0a0;
            max-width: 400px;
            line-height: 1.6;
        }
        .drm-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 16px;
            margin-top: 25px;
            font-size: 12px;
            color: #c0c0c0;
        }
        .drm-badge svg {
            width: 16px;
            height: 16px;
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner">
            <svg viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" fill="none" stroke="#4a90d9" stroke-width="4" stroke-linecap="round" stroke-dasharray="31.4 31.4" />
            </svg>
        </div>
        <h1>Loading DRM System...</h1>
        <p class="pulse">Initializing secure content playback environment. This may take a moment on first load.</p>
        <div class="drm-badge">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
            WebView2 Protected Content
        </div>
    </div>
</body>
</html>
