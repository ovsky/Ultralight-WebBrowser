# .github/workflows/windows-build.yml
#
# Builds the project on Windows (Visual Studio)
# This uses a multi-config generator, so the --config flag
# is used during the build step.

name: Build - Windows

# Require minimum permissions for artifact upload on PRs/forks and allow workflow cancellation
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL (raw .7z in base-sdk branch)"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      create_installer:
        description: "Create Windows installer via CPack (NSIS)"
        required: false
        type: boolean
      development_build:
        description: "Development build (keeps intermediate packages, verbose logs)"
        required: false
        type: boolean
        default: false
      clean_build:
        description: "Clean build (skip all caches for fresh build)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      sdk_url:
        description: "Override ULTRALIGHT_SDK_URL (raw .7z in base-sdk branch)"
        required: false
        type: string
      version:
        description: "Override ULTRALIGHT_VERSION (eg. 1.4.0)"
        required: false
        type: string
      webbrowser_version:
        description: "Override build version name (default 'dev')"
        required: false
        type: string
      create_installer:
        description: "Create Windows installer via CPack (NSIS)"
        required: false
        type: boolean
        default: false
      development_build:
        description: "Development build (keeps intermediate packages, verbose logs)"
        required: false
        type: boolean
        default: false
      clean_build:
        description: "Clean build (skip all caches for fresh build)"
        required: false
        type: boolean
        default: false

jobs:
  validate_yaml:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install yamllint and PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml yamllint

      - name: Run yamllint on build-windows.yml
        run: |
          yamllint -c .yamllint.yml .github/workflows/build-windows.yml || echo "yamllint completed with warnings"

      - name: Sanity-parse with PyYAML
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build-windows.yml','r',encoding='utf-8')); print('PyYAML: parse OK')"

  build:
    runs-on: windows-latest
    env:
      ULTRALIGHT_SDK_URL: ${{ inputs.sdk_url || github.event.inputs.sdk_url }}
      ULTRALIGHT_VERSION: ${{ inputs.version || github.event.inputs.version }}
      WEBBROWSER_VERSION: ${{ inputs.webbrowser_version || github.event.inputs.webbrowser_version || 'dev' }}
      CREATE_INSTALLER: ${{ inputs.create_installer || github.event.inputs.create_installer }}
      DEVELOPMENT_BUILD: ${{ inputs.development_build || github.event.inputs.development_build || 'false' }}
      CLEAN_BUILD: ${{ inputs.clean_build || github.event.inputs.clean_build || 'false' }}

    steps:
      - name: "0. Configure Git (longpaths, autocrlf=false)"
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: "1. Checkout Code (with submodules)"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 1

      - name: "1.5 Setup CMake Build Cache"
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: |
            build
            !build/CMakeFiles
            !build/Testing
            !build/_CPack_Packages
            !build/**/*.exe
            !build/**/*.dll
            !build/**/*.zip
            !build/**/*.7z
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ${{ runner.os }}-cmake-

      - name: "1.6 Setup SDK Cache"
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: |
            libs/Ultralight
            ultralight-sdk-*.7z
          key: ${{ runner.os }}-sdk-${{ env.ULTRALIGHT_VERSION || 'latest' }}
          restore-keys: |
            ${{ runner.os }}-sdk-

      - name: "1.7 Setup Compiler Cache (sccache)"
        if: inputs.clean_build != true
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: "1.8 Configure Compiler Cache Environment"
        if: inputs.clean_build != true
        shell: pwsh
        run: |
          echo "SCCACHE_DIR=$env:GITHUB_WORKSPACE\.sccache" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      - name: "2. Detect ULTRALIGHT_SDK_URL from repo base-sdk branch (Windows)"
        id: detect_url
        shell: pwsh
        run: |
          if ($env:ULTRALIGHT_SDK_URL) {
            Write-Host "ULTRALIGHT_SDK_URL already provided: $env:ULTRALIGHT_SDK_URL"
            exit 0
          }
          # First attempt: Use GitHub API to list sdks branch and pick latest Windows SDK (x64)
          $api = "https://api.github.com/repos/${{ github.repository }}/contents/sdks?ref=base-sdk"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          Write-Host "Querying GitHub API for SDK files: $api"
          try { $resp = Invoke-RestMethod -Uri $api -Headers $headers -Method Get -UseBasicParsing } catch { $resp = $null }
          if ($resp) {
            $names = @($resp | Where-Object { $_.type -eq 'file' } | ForEach-Object { $_.name })
            if ($names.Count -gt 0) {
              Write-Host "Found files in sdks branch:"; $names | ForEach-Object { Write-Host "  $_" }
              $candidates = @()
              foreach ($n in $names) {
                if ($n -match '^ultralight(-free)?-sdk-([0-9]+\.[0-9]+\.[0-9]+)-(win|windows)-x64\.7z$') { $candidates += $n }
              }
              if ($candidates.Count -gt 0) {
                $best = $null
                foreach ($f in $candidates) {
                  $m = [regex]::Match($f, '([0-9]+\.[0-9]+\.[0-9]+)')
                  if ($m.Success) {
                    $ver = [version]$m.Groups[1].Value
                    if (-not $best -or $ver -gt $best.Version) { $best = [pscustomobject]@{ Version=$ver; File=$f } }
                  }
                }
                if ($best) {
                  $baseRaw = "https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks"
                  $url = "$baseRaw/$($best.File)"
                  Write-Host "Auto-detected latest Windows SDK URL=$url"
                  "ULTRALIGHT_SDK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "ULTRALIGHT_VERSION=$($best.Version.ToString())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "version=$($best.Version.ToString())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  exit 0
                }
              }
            }
          }
          $header = "data/include/Ultralight/Defines.h"
          $version = $null
          if (Test-Path $header) {
            $matchLine = Select-String -Path $header -Pattern '^#define\s+ULTRALIGHT_VERSION\s+"([^"]+)"' | Select-Object -First 1
            if ($matchLine) { $version = $matchLine.Matches[0].Groups[1].Value }
          }
          if (-not $version) {
            if ($env:ULTRALIGHT_VERSION) { $version = $env:ULTRALIGHT_VERSION; Write-Host "ULTRALIGHT_VERSION provided via env: $version" }
            else { $version = '1.4.0'; Write-Host "ULTRALIGHT_VERSION not found in header; defaulting to $version" }
          }
          $baseRaw = "https://raw.githubusercontent.com/${{ github.repository }}/base-sdk/sdks"
          Write-Host "Detected ULTRALIGHT_VERSION=$version; probing Windows SDK URLs under $baseRaw"
          Write-Host "Header path: $header"
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Commit: ${{ github.sha }}"
          $candidates = @(
            "$baseRaw/ultralight-free-sdk-$version-win-x64.7z",
            "$baseRaw/ultralight-free-sdk-$version-windows-x64.7z"
          )
          function Test-Url($u) {
            try { $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing; return $true } catch {}
            try {
              $tmp = Join-Path $env:RUNNER_TEMP "probe.tmp"
              Invoke-WebRequest -Uri $u -Method Get -UseBasicParsing -OutFile $tmp | Out-Null
              Remove-Item $tmp -ErrorAction SilentlyContinue
              return $true
            } catch { return $false }
          }
          $found = $null
          foreach ($url in $candidates) {
            Write-Host "Probing $url"
            if (Test-Url $url) { $found = $url; break }
          }
          if ($found) {
            Write-Host "Auto-detected ULTRALIGHT_SDK_URL=$found"
            "ULTRALIGHT_SDK_URL=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "url=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Error "Could not auto-detect a valid Windows SDK URL in base-sdk branch for version $version."
            exit 1
          }

      - name: "3. Install 7zip"
        shell: pwsh
        run: |
          # Install 7-Zip and verify with a benign command that returns exit code 0
          choco install 7zip -y --no-progress
          $sevenZipExe = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (Test-Path $sevenZipExe) {
            # Make 7z available for subsequent steps in this job
            (Split-Path $sevenZipExe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & $sevenZipExe i | Out-Host
          } else {
            # Fallback to PATH if 7z is already present on the runner image
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z i | Out-Host
            } else {
              Write-Error "7z.exe not found after installation."
              exit 1
            }
          }

      - name: "4. Prepare Ultralight SDK (Windows)"
        id: prep_sdk
        shell: pwsh
        run: |
          $rootDefault = Join-Path $env:GITHUB_WORKSPACE 'data'
          $root = $env:ULTRALIGHT_SDK_ROOT
          if (-not $root) { $root = $rootDefault }
          Write-Host "Initial ULTRALIGHT_SDK_ROOT candidate: $root"
          $present = 'false'
          if ((Test-Path (Join-Path $root 'include')) -and ((Test-Path (Join-Path $root 'lib')) -or (Test-Path (Join-Path $root 'bin')))) {
            $present = 'true'
          } elseif ($env:ULTRALIGHT_SDK_URL) {
            # Normalize GitHub blob URLs to raw
            $dlUrl = $env:ULTRALIGHT_SDK_URL
            if ($dlUrl -match '^https://github.com/([^/]+)/([^/]+)/blob/(.+)$') {
              $orig = $dlUrl
              $dlUrl = "https://raw.githubusercontent.com/$($Matches[1])/$($Matches[2])/$($Matches[3])"
              Write-Host "Normalized GitHub blob URL to raw: $orig -> $dlUrl"
            }
            Write-Host "Downloading Ultralight SDK from ULTRALIGHT_SDK_URL=$dlUrl"
            $pkg = Join-Path $env:RUNNER_TEMP 'ultralight-sdk'
            try { $head = Invoke-WebRequest -Uri $dlUrl -UseBasicParsing -Method Head } catch {}
            if ($head) { Write-Host ("HEAD status: {0}" -f $head.StatusCode); $head.Headers.GetEnumerator() | Select-Object -First 12 | ForEach-Object { Write-Host ("  {0}: {1}" -f $_.Key, $_.Value) } }
            Invoke-WebRequest -Uri $dlUrl -UseBasicParsing -OutFile $pkg
            Write-Host "Downloaded SDK archive at: $pkg"
            Get-Item $pkg | Format-List -Property FullName,Length
            $extract = Join-Path $env:RUNNER_TEMP 'sdk-extract'
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            # Validate archive by testing with 7z instead of relying on URL extension
            $test = & 7z t -y "$pkg" 2>$null; if ($LASTEXITCODE -ne 0) {
              Write-Error "Downloaded file is not a valid 7z archive or is corrupted: $dlUrl";
              try { Get-Item "$pkg" | Format-List -Property FullName,Length,CreationTime } catch {}
              exit 1
            }
            & 7z x -y -o"$extract" "$pkg" | Out-Null
            Write-Host "Extraction tree (depth 2):"
            Get-ChildItem -Path $extract -Depth 2 -Directory | ForEach-Object { $_.FullName } | ForEach-Object { "  $_" }
            $rootFound = Get-ChildItem -Path $extract -Recurse -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'include') -and Test-Path (Join-Path $_.FullName 'lib') } | Select-Object -First 1
            if ($rootFound) { $root = $rootFound.FullName; $present = 'true' }
          }
          "present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($present -eq 'true') {
            Write-Host "Using ULTRALIGHT_SDK_ROOT=$root"
            "ULTRALIGHT_SDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Listing selected SDK include and lib:"
            if (Test-Path (Join-Path $root 'include')) { Get-ChildItem -Force (Join-Path $root 'include') | Select-Object -First 50 | Format-List -Property Mode,Length,Name }
            if (Test-Path (Join-Path $root 'lib')) { Get-ChildItem -Force (Join-Path $root 'lib') | Format-List -Property Mode,Length,Name }
            # Write SDK version to file for build summary
            if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" -Force | Out-Null }
            $sdkVer = if ($env:ULTRALIGHT_VERSION) { $env:ULTRALIGHT_VERSION } else { "Unknown" }
            $sdkVer | Out-File -FilePath "build/ultralight_sdk_version.txt" -Encoding utf8 -NoNewline
            Write-Host "Wrote SDK version to build/ultralight_sdk_version.txt: $sdkVer"
          } else {
            Write-Error "Ultralight Windows SDK not found. Ensure base-sdk branch contains a valid archive or set ULTRALIGHT_SDK_ROOT/ULTRALIGHT_SDK_URL."; exit 1
          }

      - name: "4.5 Install libcurl (vcpkg/choco)"
        shell: pwsh
        run: |
          Write-Host "Attempting to install libcurl for build via vcpkg / chocolatey..."
          pwsh -File "${{ github.workspace }}\scripts\install_curl.ps1"

      - name: "5. Configure CMake"
        if: steps.prep_sdk.outputs.present == 'true'
        run: |
          # Skip reconfiguration if CMakeCache.txt exists and is valid
          if (Test-Path "build/CMakeCache.txt") {
            Write-Host "CMake cache found, checking if reconfiguration needed..."
            $cacheValid = $true
            
            # Check if SDK root changed
            $cachedSdkRoot = Get-Content "build/CMakeCache.txt" | Select-String "ULTRALIGHT_SDK_ROOT:.*=" | ForEach-Object { $_ -replace '.*=', '' }
            if ($cachedSdkRoot -ne $env:ULTRALIGHT_SDK_ROOT) {
              Write-Host "SDK root changed, reconfiguration needed"
              $cacheValid = $false
            }
            
            if ($cacheValid) {
              Write-Host "✅ CMake cache is valid, skipping reconfiguration (saves ~30-60 seconds)"
              exit 0
            }
          }
          
          # Ensure libcurl is present; if our earlier step installed vcpkg and curl, the toolchain file should be used.
          Write-Host "(CI) libcurl install attempt finished (if available)."
          cmake --version
          Write-Host "Configuring with ULTRALIGHT_SDK_ROOT=$env:ULTRALIGHT_SDK_ROOT"
          $createInstaller = "$env:CREATE_INSTALLER"
          if ($createInstaller -eq '' -or $null -eq $createInstaller) { $createInstaller = 'false' }
          $installerFlag = if ($createInstaller -match '^(true|1|on)$') { 'ON' } else { 'OFF' }
          Write-Host "CREATE_INSTALLER=$createInstaller -> -DCREATE_INSTALLER=$installerFlag"
          # If vcpkg was installed via install_curl.ps1 in prior step, pass toolchain file
          $vcpkgToolchain = if ($env:VCPKG_ROOT) { "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" } else { "" }
          # Prefer Visual Studio for compatibility with MSVC-built SDK libs
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DULTRALIGHT_SDK_ROOT="$env:ULTRALIGHT_SDK_ROOT" -DBUILD_TESTING=OFF -DAUTO_INSTALL_CURL=ON -DCREATE_INSTALLER=$installerFlag -DWEBBROWSER_VERSION="$env:WEBBROWSER_VERSION" -DCMAKE_BUILD_TYPE=Release $vcpkgToolchain

      - name: "6. Build Project"
        # Build; work with both multi-config and ninja (single-config)
        shell: pwsh
        run: |
          # Fail fast on any error
          $ErrorActionPreference = 'Stop'
          Write-Host "Building project (generator-aware)"
          # Attempt multi-config build (Visual Studio). If it fails, run the single-config fallback (Ninja)
          & cmake --build build --config Release --parallel
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "Multi-config build failed with exit code $code. Attempting single-config fallback..."
            & cmake --build build -- -j $env:NUMBER_OF_PROCESSORS
            exit $LASTEXITCODE
          }

      - name: "6.15 Install NSIS (for installer)"
        if: ${{ inputs.create_installer == true || github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Prefer the 32-bit Program Files location where NSIS places makensis.exe.
          # Some runner images may not set all ProgramFiles variables, so only
          # construct paths when the env var is present. Also include standard
          # Chocolatey install locations as a fallback.
          $nsisDirs = @()
          if (${env:ProgramFiles(x86)} -and ${env:ProgramFiles(x86)} -ne '') { $nsisDirs += Join-Path ${env:ProgramFiles(x86)} 'NSIS' }
          if ($env:ProgramFiles -and $env:ProgramFiles -ne '') { $nsisDirs += Join-Path $env:ProgramFiles 'NSIS' }
          if ($env:ProgramFiles -and $env:ProgramFiles -ne '') { $nsisDirs += Join-Path $env:ProgramFiles 'NSIS (x86)' }
          # Chocolatey typically installs to ProgramData
          $nsisDirs += 'C:\ProgramData\chocolatey\lib\nsis\tools'
          $nsisDirs += 'C:\ProgramData\chocolatey\lib\nsis.install\tools'

          $found = $null
          foreach ($d in $nsisDirs) {
            try {
              $candidate = Join-Path $d 'makensis.exe'
            } catch {
              continue
            }
            if (Test-Path $candidate) { $found = (Split-Path $candidate -Parent); break }
          }
          if ($found) {
            Write-Host "NSIS found at: $found"
            # Ensure makensis is available in PATH for this job
            $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & (Join-Path $found 'makensis.exe') /VERSION | Out-Host
          } else {
            Write-Warning "NSIS makensis.exe not found after install; CPack NSIS may not be available."
          }

      - name: "6.2 Package (CPack)"
        if: ${{ inputs.create_installer == true }}
        shell: pwsh
        run: |
          # Ensure transient errors don't stop the script so we can always collect logs and exit cleanly
          $ErrorActionPreference = 'Continue'
          Write-Host "Packaging with CPack (Release config)"
          try {
            pushd build

            # Produce ZIP first; treat ZIP as required output. Capture output to a log.
            $zipLog = "zip-cpack.log"
            Write-Host "Running: cpack -C Release -G ZIP  (logging to $zipLog)"
            cmd /c "cpack -C Release -G ZIP > $zipLog 2>&1"
            $zipCode = $LASTEXITCODE
            if ($zipCode -ne 0) {
              Write-Error "ZIP packaging failed with exit code $zipCode"
              if (Test-Path $zipLog) {
                Write-Host "=== cpack ZIP log (begin) ==="
                Get-Content $zipLog -Raw | Write-Host
                Write-Host "=== cpack ZIP log (end) ==="
              }
              throw "ZIP packaging failed"
            }

            # Try NSIS installer generation if makensis exists. Capture cpack NSIS output to a log so we can print it on failure.
            if (Get-Command makensis -ErrorAction SilentlyContinue) {
              $nsisLog = "nsis-cpack.log"
              Write-Host "Running: cpack -C Release -G NSIS  (logging to $nsisLog)"
              cmd /c "cpack -C Release -G NSIS > $nsisLog 2>&1"
              $nsisCode = $LASTEXITCODE
              if ($nsisCode -ne 0) {
                Write-Warning "NSIS packaging failed with exit code $nsisCode"
                if (Test-Path $nsisLog) {
                  Write-Host "=== cpack NSIS log (begin) ==="
                  Get-Content $nsisLog -Raw | Write-Host
                  Write-Host "=== cpack NSIS log (end) ==="
                }

                # Also print the NSISOutput.log produced by makensis (if present)
                $nsisOutput = Get-ChildItem -Path _CPack_Packages -Recurse -Filter NSISOutput.log -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($nsisOutput) {
                  Write-Host "=== NSISOutput.log (begin) ==="
                  Get-Content $nsisOutput.FullName -Raw | Write-Host
                  Write-Host "=== NSISOutput.log (end) ==="
                } else {
                  Write-Warning "NSISOutput.log not found under build/_CPack_Packages"
                }
                # Do not throw here: NSIS failures are non-fatal for our pipeline (we keep ZIP)
              }
            } else {
              Write-Warning "makensis not found in PATH; skipping NSIS installer generation."
            }
          } finally {
            # Ensure we always popd even if earlier commands failed
            try { popd } catch {}
          }

          Write-Host "CPack outputs:"
          Get-ChildItem -Path build -Recurse -Include *.exe,*.msi,*.zip | Select-Object -Property FullName,Length | Format-Table -AutoSize

          # If ZIP succeeded above, return success regardless of NSIS result.
          exit 0

      - name: "6.3 Rename Windows installer"
        if: ${{ inputs.create_installer == true }}
        shell: pwsh
        run: |
          $version = "$env:WEBBROWSER_VERSION"
          # Find the CPack ZIP and move it to workspace root with a stable name
          $cpackZip = Get-ChildItem -Path build -Filter "*.zip" -File -Recurse | Select-Object -First 1
          if ($cpackZip) {
            $finalZipName = "Ultralight-WebBrowser-$version-Windows-x64.zip"
            Write-Host "Renaming CPack ZIP: $($cpackZip.Name) -> $finalZipName"
            Move-Item -Force $cpackZip.FullName (Join-Path $PWD $finalZipName)
          } else {
            Write-Warning "No CPack ZIP found to rename."
          }

          # Robust installer detection:
          # CPack may emit installers named like 'Ultralight-WebBrowser-<ver>-Windows-x64.exe'
          # or place them in build/_CPack_Packages. Search for any matching exe under build
          # that starts with the project prefix and move it to a stable name in workspace root.
          $installerCandidates = Get-ChildItem -Path build -Include "Ultralight-WebBrowser-*.exe" -File -Recurse -ErrorAction SilentlyContinue
          if (-not $installerCandidates) {
            # Also try any .msi produced by some generators
            $installerCandidates = Get-ChildItem -Path build -Include "*.msi" -File -Recurse -ErrorAction SilentlyContinue
          }
          if ($installerCandidates) {
            $installer = $installerCandidates | Select-Object -First 1
            $finalInstallerName = "Ultralight-WebBrowser-$version-Windows-Installer.exe"
            # If the found file is an MSI, keep .msi extension
            if ($installer.Extension -ieq ".msi") {
              $finalInstallerName = "Ultralight-WebBrowser-$version-Windows-Installer.msi"
            }
            Write-Host "Renaming installer: $($installer.FullName) -> $finalInstallerName"
            Move-Item -Force $installer.FullName (Join-Path $PWD $finalInstallerName)
          } else {
            Write-Host "No installer (.exe or .msi) found under build to rename (OK if NSIS skipped or failed)."
          }

      - name: "6.2.5 Upload NSIS logs (if any)"
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-nsis-logs
          path: |
            build\nsis-cpack.log
            build\_CPack_Packages\**\NSISOutput.log
          if-no-files-found: warn

      - name: "6.2.6 Upload full CPack package directory for debug (optional, may be large)"
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-cpack-debug
          path: |
            build\_CPack_Packages\**
          if-no-files-found: warn

      # NOTE: Tests temporarily disabled on CI due to Ultralight SDK runtime library issues
      # - name: "6.8 Run tests (ctest)"
      #   run: ctest --test-dir build -C Release --output-on-failure

      - name: "6.5 Diagnostics: verify runtime contents"
        if: ${{ env.DEVELOPMENT_BUILD == 'true' }}
        shell: pwsh
        run: |
          $candidates = @(
            'build\Release',
            'build\bin\Release',
            'build\Ultralight-WebBrowser\Release',
            'build\samples\Ultralight-WebBrowser\Release'
          )
          $src = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $src = $p; break }
          }
          if (-not $src) { throw "No expected output folder found for diagnostics. Checked: $($candidates -join ', ')" }
          Write-Host "Listing runtime directory: $src"
          Get-ChildItem -Force $src | Format-List -Property Mode,Length,Name
          Write-Host "Listing DLLs:"; Get-ChildItem -Path (Join-Path $src '*.dll') -ErrorAction SilentlyContinue | Format-List -Property Mode,Length,Name
          Write-Host "Listing resources:"; if (Test-Path (Join-Path $src 'assets/resources')) { Get-ChildItem -Force (Join-Path $src 'assets/resources') | Format-List -Property Mode,Length,Name } else { Write-Host 'assets/resources not found' }

      - name: "7. Generate Build Summary Report"
        shell: pwsh
        run: |
          Write-Host "🚀 Generating comprehensive build summary..."
          
          # Get SDK version from environment or detect from files
          $sdkVersion = if ($env:ULTRALIGHT_VERSION) { $env:ULTRALIGHT_VERSION } else { "Unknown" }
          if (Test-Path "build/ultralight_sdk_version.txt") {
            $sdkVersion = Get-Content "build/ultralight_sdk_version.txt" -Raw -ErrorAction SilentlyContinue | Out-String
            $sdkVersion = $sdkVersion.Trim()
          }
          
          # Run the build summary script
          pwsh scripts/generate-build-summary.ps1 `
            -BuildDir "build" `
            -Platform "Windows" `
            -Architecture "x64" `
            -Version "$env:WEBBROWSER_VERSION" `
            -CommitSha "${{ github.sha }}" `
            -SdkVersion "$sdkVersion" `
            -OutputFile "BUILD-SUMMARY.md"
          
          # Also create a JSON metadata file for programmatic access
          $metadata = @{
            platform = "Windows"
            architecture = "x64"
            version = "$env:WEBBROWSER_VERSION"
            commit = "${{ github.sha }}"
            commitShort = "${{ github.sha }}".Substring(0, 7)
            buildDate = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
            sdkVersion = $sdkVersion
            repository = "${{ github.repository }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
          }
          
          $metadata | ConvertTo-Json -Depth 10 | Out-File -FilePath "build/BUILD-METADATA.json" -Encoding UTF8
          
          Write-Host "✅ Build summary and metadata generated successfully"

      - name: "7.5 Display Build Summary"
        shell: pwsh
        run: |
          Write-Host "📊 Build Summary:"
          Write-Host "═══════════════════════════════════════════════════════════"
          if (Test-Path "build/BUILD-SUMMARY.md") {
            Get-Content "build/BUILD-SUMMARY.md"
          } else {
            Write-Host "⚠️ BUILD-SUMMARY.md not found"
          }
          Write-Host "═══════════════════════════════════════════════════════════"

      - name: "7.8 Upload Final Packages"
        # For multi-config, Visual Studio places outputs in 'build/Release'
        # We use PowerShell's Compress-Archive
        shell: pwsh
        run: |
          # Detect the actual output folder and zip it (handles different generators/layouts)
          $candidates = @(
            'build\Release',
            'build\bin\Release',
            'build\Ultralight-WebBrowser\Release',
            'build\samples\Ultralight-WebBrowser\Release'
          )
          $src = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $src = $p; break }
          }
          if (-not $src) {
            throw "No expected output folder found. Checked: $($candidates -join ', ')"
          }
          Write-Host "Archiving from: $src"
          $version = "$env:WEBBROWSER_VERSION"
          $outName = "Ultralight-WebBrowser-$version-Windows-Portable.zip"
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $outName -Force

      - name: "7.9 Pre-upload diagnostics: list artifacts to upload"
        shell: pwsh
        run: |
          Write-Host "Listing candidate artifacts before upload (workspace root and build/)"
          $patterns = @(
            'Ultralight-WebBrowser-*-Windows-Portable.zip',
            'Ultralight-WebBrowser-*-Windows-x64.zip',
            'Ultralight-WebBrowser-*-Windows-Installer.exe',
            'build\*.zip',
            'build\*.msi'
          )
          foreach ($p in $patterns) {
            Write-Host "Pattern: $p"
            $found = Get-ChildItem -Path $p -File -ErrorAction SilentlyContinue -Recurse | Select-Object -First 100
            if ($found) {
              $found | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round(($_.Length/1KB),2)) KB)" }
            } else {
              Write-Host "  (none)"
            }
          }

      - name: "8.0b Debug: locate/move installer to workspace root (if any)"
        if: ${{ inputs.create_installer == true }}
        shell: pwsh
        run: |
          Write-Host "Listing build/ tree (top-level, depth 3) for debugging"
          Get-ChildItem -Path build -Recurse -Depth 3 -File | Sort-Object Length -Descending | Select-Object -First 200 | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round(($_.Length/1KB),2)) KB)" }

          # Robust search for installer candidates: prefer names starting with project prefix,
          # then names containing 'installer' or 'setup', then fall back to largest exe/msi.
          $candidates = Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.exe','.msi' }
          $matchPrefixed = $candidates | Where-Object { $_.Name -match '^Ultralight-WebBrowser-.*\.(exe|msi)$' }
          $matchInstaller = $candidates | Where-Object { $_.Name -match '(installer|setup|setup-?x?)' -or $_.Name -match '\bSetup\b' }

          $chosen = $null
          if ($matchPrefixed) { $chosen = $matchPrefixed | Sort-Object Length -Descending | Select-Object -First 1 }
          elseif ($matchInstaller) { $chosen = $matchInstaller | Sort-Object Length -Descending | Select-Object -First 1 }
          elseif ($candidates) { $chosen = $candidates | Sort-Object Length -Descending | Select-Object -First 1 }

          if ($chosen) {
            $version = "$env:WEBBROWSER_VERSION"
            $ext = $chosen.Extension
            $finalName = "Ultralight-WebBrowser-$version-Windows-Installer$ext"
            Write-Host "Found installer candidate: $($chosen.FullName) -> copying as $finalName"
            Copy-Item -Force $chosen.FullName (Join-Path $PWD $finalName)
            Write-Host "Workspace root now contains:"; Get-ChildItem -Path $PWD -Filter "Ultralight-WebBrowser-*Installer.*" -File | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round(($_.Length/1KB),2)) KB)" }
          } else {
            Write-Host "No installer candidates found under build/. Trying to parse CPack logs for produced package paths..."
            $possibleLogFiles = @("build\nsis-cpack.log","build\zip-cpack.log","build\zip-cpack.log")
            $foundFromLog = $null
            foreach ($log in $possibleLogFiles) {
              if (Test-Path $log) {
                Write-Host "Parsing log: $log"
                $lines = Get-Content $log -ErrorAction SilentlyContinue
                foreach ($ln in $lines) {
                  if ($ln -match 'CPack: - package: (.+)') {
                    $pkgPath = $Matches[1].Trim()
                    Write-Host "Found package entry in log: $pkgPath"
                    # Try absolute path first, then relative to build dir, then workspace root
                    if (Test-Path $pkgPath) { $foundFromLog = Get-Item $pkgPath; break }
                    $candidate = Join-Path (Join-Path $PWD 'build') $pkgPath
                    if (Test-Path $candidate) { $foundFromLog = Get-Item $candidate; break }
                    $candidate2 = Join-Path $PWD $pkgPath
                    if (Test-Path $candidate2) { $foundFromLog = Get-Item $candidate2; break }
                  }
                }
                if ($foundFromLog) { break }
              }
            }
            if ($foundFromLog) {
              $version = "$env:WEBBROWSER_VERSION"
              $ext = $foundFromLog.Extension
              $finalName = "Ultralight-WebBrowser-$version-Windows-Installer$ext"
              Write-Host "Copying package found in logs: $($foundFromLog.FullName) -> $finalName"
              Copy-Item -Force $foundFromLog.FullName (Join-Path $PWD $finalName)
              Write-Host "Workspace root now contains:"; Get-ChildItem -Path $PWD -Filter "Ultralight-WebBrowser-*Installer.*" -File | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round(($_.Length/1KB),2)) KB)" }
            } else {
              Write-Host "CPack logs did not reveal a package path either. No installer will be uploaded."
            }
          }

      - name: "8. Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-build
          path: |
            Ultralight-WebBrowser-*-Windows-Portable.zip
            build/BUILD-SUMMARY.md
            build/BUILD-METADATA.json
          if-no-files-found: warn

      - name: "8.1 Upload Installer"
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-installer
          path: |
            Ultralight-WebBrowser-*-Windows-Installer.exe
            build\**\*.exe
            build\**\*.msi
            build\_CPack_Packages\**\*.exe
            build\_CPack_Packages\**\*.msi
            build/BUILD-SUMMARY.md
            build/BUILD-METADATA.json
          if-no-files-found: warn

      - name: "8.2 Upload CPack ZIP"
        if: ${{ inputs.create_installer == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-windows-cpack-zip
          path: |
            Ultralight-WebBrowser-*-Windows-x64.zip
            build\*.zip
            build/BUILD-SUMMARY.md
            build/BUILD-METADATA.json
          if-no-files-found: warn

      - name: "9. Job Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host "📋 Adding build summary to GitHub Actions job summary..."
          if (Test-Path "build/BUILD-SUMMARY.md") {
            Get-Content "build/BUILD-SUMMARY.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
            Write-Host "✅ Summary added to job output"
          } else {
            Write-Host "⚠️ BUILD-SUMMARY.md not found, skipping job summary"
          }
          
          # Show cache statistics
          Write-Host ""
          Write-Host "📊 Cache Statistics:"
          Write-Host "═══════════════════════════════════════════════════════════"
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not found in PATH"
          }
          Write-Host "═══════════════════════════════════════════════════════════"
